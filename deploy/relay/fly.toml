# The shared OpenBots relay on Fly Machines (deploy/relay/README.md). It runs
# as exactly one Machine with SINGLE_SERVER_DEPLOY=true: the registry is in
# memory, nothing calls Redis, and every server (the Mac app) and every phone
# (the iOS app) meets on that one Machine. A second Machine would split them,
# and a phone that lands on the other one gets 4404, so keep the count at 1.
#
#   fly launch --copy-config --no-deploy --name <your app>
#   fly secrets set RELAY_METRICS_TOKEN=...
#   fly deploy --image <image> --ha=false  # the first deploy, by hand
#   fly scale count 1 --yes                # and keep it there
#
# To go back to several Machines, see "Several Machines" in the README: it
# needs Redis, SINGLE_SERVER_DEPLOY unset, and the proxy settings below.
#
# `fly launch` replaces `app` and `primary_region` with yours. After that,
# .github/workflows/deploy-relay.yml builds and deploys the relay on every push
# to main that changes it, as ghcr.io/<owner>/openbots/relay:sha-<commit sha>.

app = "openbots-relay"
primary_region = "iad"

# A deploy or a restart sends SIGTERM. The relay then drains: it reports not
# ready, takes nothing new, and after the grace period (RELAY_DRAIN_GRACE_MS,
# 20 seconds) closes what is left with 1012, so servers and phones reconnect
# once the new Machine is up. The kill timeout must outlast the grace period,
# or Fly kills the Machine mid drain.
kill_signal = "SIGTERM"
kill_timeout = 30

# No [build]: every deploy names its image with --image (the workflow passes
# ghcr.io/<owner>/openbots/relay:sha-<commit sha>), so a `fly deploy` by hand without one
# fails rather than rolling the relay back to an old pinned release. Run
# `fly releases --image` to see which image each release ran.

[deploy]
  # The one Machine is replaced in place: it drains, then the new image
  # starts. Servers and phones are without the relay for that gap (up to the
  # grace period plus a boot) and reconnect with their usual backoff.
  strategy = "rolling"
  max_unavailable = 1

[env]
  RELAY_PORT = "3200"
  # On Fly the relay reads the client's address from Fly-Client-IP.
  RELAY_TRUST_PROXY = "true"
  RELAY_DRAIN_GRACE_MS = "20000"
  # The socket ceiling, matched by [http_service.concurrency] below.
  RELAY_MAX_SOCKETS = "20000"
  # Bytes in flight across the Machine's sockets: 512 MiB, inside the
  # Machine's memory below.
  RELAY_BUDGET_BYTES = "536870912"
  # Must be 1 with SINGLE_SERVER_DEPLOY; the relay refuses to start otherwise.
  RELAY_MIN_CLUSTER_SIZE = "1"
  RELAY_LOG_LEVEL = "info"
  # One Machine: the registry stays in memory and nothing calls Redis, even if
  # a RELAY_REDIS_URL secret is still set, and nothing is replayed.
  SINGLE_SERVER_DEPLOY = "true"
  # Set as secrets, never here (`fly secrets set`; see the README):
  #   RELAY_REDIS_URL       the registry, only for several Machines. Not used
  #                         while SINGLE_SERVER_DEPLOY is true
  #   RELAY_METRICS_TOKEN   bearer token for GET /metrics. Without it /metrics is 404
  #   RELAY_PRESENCE_TOKEN  optional: bearer token GET /v1/hosts/{id} then wants
  #   RELAY_APNS_KEY_ID, RELAY_APNS_TEAM_ID, RELAY_APNS_TOPIC
  #   RELAY_APNS_KEY        the .p8 key, base64. The relay reads it once at
  #                         start and deletes it from its environment, so no
  #                         key file is written and none needs to be readable
  #                         by the relay's user
  # RELAY_NODE_ID stays unset on Fly: the relay takes the Machine's own
  # FLY_MACHINE_ID. Replays are off with SINGLE_SERVER_DEPLOY, since there is
  # no other Machine to replay to; RELAY_REPLAY must not be set to fly.

[http_service]
  internal_port = 3200
  force_https = true
  # The one Machine always runs. The proxy neither stops it when idle nor
  # starts any other, so a stray stopped Machine (from `fly scale count` or an
  # old deploy) is never brought up beside it to split servers from phones.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  # Counted by connection, as the relay counts its sockets. At the hard limit
  # the proxy sends the Machine nothing more. The relay itself refuses
  # upgrades with 503 at RELAY_MAX_SOCKETS.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 16000
    hard_limit = 20000

  # Not ready while draining or at the socket ceiling: the proxy then sends
  # this Machine nothing new.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "10s"
    timeout = "2s"
    method = "GET"
    path = "/ready"

# Liveness, reported by `fly checks list`. A top level check never routes or
# stops anything.
[checks]
  [checks.alive]
    type = "http"
    port = 3200
    path = "/healthz"
    method = "get"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# The byte budget is 512 MiB; 1 GB more covers Node, the sockets' own
# buffers, and headroom.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
