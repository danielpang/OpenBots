# hadolint settings for docker/*.Dockerfile (CI's "Lint the Dockerfiles" step).
#
# DL3006 (untagged FROM) cannot see through `FROM ${NODE_IMAGE}`: every base
# image is named by an ARG so a build can swap it (a mirror, a digest), and
# each ARG default is a tagged image (node:22-bookworm-slim, ubuntu:24.04).
# Keep those defaults tagged; hadolint does not check them for us.
ignored:
  - DL3006
