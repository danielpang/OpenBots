name: Verification review

# Once a month, opens an issue with the numbers for reviewing the checks
# themselves: how commits were verified, what the checks missed (reverts and
# quick follow-up fixes), and how large the rules have grown. The tidy-checks
# skill (.claude/skills/tidy-checks) works through it. Rules only grow unless
# someone prunes them; this is the reminder.

on:
  schedule:
    - cron: '23 14 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Write the report
        run: node scripts/verification-stamps.mjs report --days 30 | tee "$RUNNER_TEMP/report.md"
      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Verification review: $(date -u '+%B %Y')" \
            --body-file "$RUNNER_TEMP/report.md"
