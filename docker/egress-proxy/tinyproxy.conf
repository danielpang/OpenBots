# The `egress-proxy` service (compose profile `egress`): an allowlisting
# forward proxy for the Bots' computers (plan 9.5). It sits on the
# openbot-sandbox network only, at OPENBOT_SANDBOX_EGRESS_PROXY_IP, so its own
# traffic meets the same sandbox firewall rules as a computer's: no private,
# LAN, link-local or host addresses. Only hosts in the allowlist are reached.

Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
# No LogFile and no Syslog: tinyproxy logs to stdout (`docker compose logs`).
LogLevel Connect
DisableViaHeader Yes

# Plain http and https (CONNECT to 443) only.
ConnectPort 443

# Deny every host the allowlist does not match. One extended regular
# expression per line, matched against the host name only.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
