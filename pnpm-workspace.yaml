packages:
  - apps/*
  - packages/*

# Versions shared across the workspace. Reference them with "catalog:".
# typescript-eslint supports TypeScript < 6.1, so TypeScript stays on 6.0.
allowBuilds:
  esbuild: false
  msgpackr-extract: false
  node-pty: true
  cpu-features: false
  electron-winstaller: false
  protobufjs: false
  ssh2: false

catalog:
  '@ai-sdk/anthropic': ^4.0.0
  '@ai-sdk/google': ^4.0.0
  '@ai-sdk/openai': ^4.0.0
  '@ai-sdk/openai-compatible': ^3.0.0
  '@ai-sdk/xai': ^5.0.0
  '@better-auth/api-key': ^1.7.7
  '@electric-sql/pglite': ^0.5.9
  '@electric-sql/pglite-pgvector': ^0.0.10
  '@electron/notarize': ^3.1.2
  '@eslint/js': ^10.0.1
  '@hono/node-server': ^2.1.5
  '@hono/zod-openapi': ^1.6.3
  '@playwright/test': ^1.64.0
  '@radix-ui/react-avatar': ^1.3.0
  '@radix-ui/react-dialog': ^1.3.0
  '@radix-ui/react-dropdown-menu': ^2.2.0
  '@radix-ui/react-scroll-area': ^1.4.0
  '@radix-ui/react-slot': ^1.5.0
  '@radix-ui/react-tooltip': ^1.4.0
  '@tailwindcss/vite': ^4.3.0
  '@tanstack/react-query': ^5.104.0
  '@tanstack/react-router': ^1.170.0
  '@tanstack/router-plugin': ^1.168.0
  '@types/node': ^22.19.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/ws': ^8.18.2
  '@vitejs/plugin-react': ^6.1.2
  ai: ^7.0.0
  better-auth: ^1.7.7
  bullmq: ^6.3.15
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  electron: ^45.0.0
  electron-builder: ^26.18.0
  electron-updater: ^6.8.11
  electron-vite: ^6.0.0
  eslint: ^10.12.0
  globals: ^17.13.0
  hono: ^4.13.13
  ioredis: ^5.11.1
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  pino: ^10.4.0
  postgres: ^3.4.9
  prettier: ^3.9.10
  prom-client: ^15.1.3
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.0
  tsx: ^4.23.15
  turbo: ^2.11.8
  typescript: ~6.0.3
  typescript-eslint: ^8.71.2
  vite: ^8.3.4
  vitest: ^5.0.4
  ws: ^8.22.0
  yaml: ^2.9.1
  zod: ^4.6.7

engineStrict: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.8'
  - '@turbo/darwin-arm64@2.11.8'
  - '@turbo/linux-64@2.11.8'
  - '@turbo/linux-arm64@2.11.8'
  - '@turbo/windows-64@2.11.8'
  - '@turbo/windows-arm64@2.11.8'
  - turbo@2.11.8
  - bullmq@6.3.15

# Patched transitive versions for `pnpm audit` (plan 18.9 dependency audit,
# docs/SECURITY.md). Drop an entry once its parent ships the fix itself.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'uuid@<11.1.1': ^11.1.1

# Advisories `pnpm audit` may ignore, each with the reason (docs/SECURITY.md).
# GHSA-g3hv-75wg-m249 (minimatch < 11.0.1, glob pattern denial of service):
# only development and packaging tools reach minimatch (ESLint, electron-builder,
# Redocly); `pnpm audit --prod` is clean. Their callers need the 3.x, 5.x and
# 9.x lines, which have no patched release, and the patterns they match come
# from this repository, not from users. Drop this once those tools move to 11.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
